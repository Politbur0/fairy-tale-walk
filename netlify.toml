# Fairy Tale Walk — static deploy. The repo root is the site root.
[build]
  publish = "."

# Service worker must never be served stale, or updates can't reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Correct content type for the manifest.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Story data should refresh promptly when the owner edits it.
[[headers]]
  for = "/data/story.json"
  [headers.values]
    Cache-Control = "no-cache"
